name: SmartLog Docker Image

on:
  pull_request:
    paths:
      - 'ai-engineering/smartlog/**'
      - '.github/workflows/smartlog-image.yml'
  push:
    branches: [main]
    paths:
      - 'ai-engineering/smartlog/**'
      - '.github/workflows/smartlog-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for test
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engineering/smartlog
          load: true
          push: false
          tags: smartlog:ci

      - name: Test inside Docker
        run: docker run --rm --entrypoint python smartlog:ci -m unittest discover -s tests -v

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish prebuilt image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engineering/smartlog
          push: true
          tags: |
            ghcr.io/naren4b/smartlog:latest
            ghcr.io/naren4b/smartlog:0.1
